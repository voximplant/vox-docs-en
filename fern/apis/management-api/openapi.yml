        - name: im_max_queue_size
          in: query
          required: false
          schema:
            type: integer
            default: 1000
          description: Maximum size of the queue with IM-type requests
        - name: priority
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: The queue's priority from 1 to 100
        - name: call_max_waiting_time_in_seconds
