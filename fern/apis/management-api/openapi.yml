      operationId: a2p-send-sms
      summary: A2PSendSms
      tags:
        - sms
      parameters:
        - name: src_number
          in: query
          required: true
          schema:
            type: string
          description: The SenderID for outgoing SMS. Please contact support for installing a SenderID
        - name: dst_numbers
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: The destination phone numbers separated by semicolons (;). The maximum number of these phone numbers is 100
        - name: text
          in: query
          required: true
          schema:
            type: string
          description: The message text, up to 1600 characters. We split long messages greater than 160 GSM-7 characters or 70 UTF-16 characters into multiple segments. Each segment is charged as one message
        - name: store_body
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to store outgoing message texts. Default value is false
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/SmsTransaction"
                  failed:
                    type: array
                    items:
                      $ref: "#/components/schemas/FailedSms"
                  fragments_count:
                    type: integer
                    description: The number of fragments the message is divided into
              examples:
                example1:
                  summary: Example 1
                  value:
                    result:
                      - message_id: 3996474
                        destination_number: "447443332213"
                    fragments_count: 1
                    failed:
                      - destination_number: "447443332212"
                        error_description: SMS failed to send
                        error_code: 385
      x-fern-sdk-method-name: a2p-send-sms
      x-fern-sdk-group-name: sms
      x-voximplant-method-name: A2PSendSms
      description: |-
        Sends an A2P SMS message from the application to customers. A SenderID is required for A2P messages. Please contact support for installing a SenderID.

        Allowed roles: `CallsSMS`.

        **Example request:** Send the SMS message with the text "Test message" from the phone number 447443332211 to the phone numbers 447443332212 and 447443332213.
      x-voximplant-roles:
        - CallsSMS
