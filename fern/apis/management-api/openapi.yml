            type: string
          description: The outgoing SIP proxy
        - name: password
          in: query
          required: false
          schema:
            type: string
          description: The SIP password
        - name: is_persistent
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether SIP registration is persistent. Set false to activate it only on the user login
        - name: application_id
          in: query
          required: false
          schema:
            type: integer
          description: The application ID which a new SIP registration is to be bound to. Can be used instead of the **application_name** parameter
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: The application name which a new SIP registration is to be bound to. Can be used instead of the **application_id** parameter
        - name: rule_id
          in: query
          required: false
          schema:
            type: integer
          description: The rule ID which a new SIP registration is to be bound to. Can be used instead of the **rule_name** parameter
        - name: rule_name
          in: query
          required: false
          schema:
            type: string
          description: The rule name which a new SIP registration is to be bound to. Can be used instead of the **rule_id** parameter
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: The user ID which a new SIP registration is to be bound to. Can be used instead of the **user_name** parameter
        - name: user_name
          in: query
          required: false
          schema:
            type: string
          description: The user name which a new SIP registration is to be bound to. Can be used instead of the **user_id** parameter
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the request has been completed successfully
                  sip_registration_id:
                    type: integer
                    description: The sip registration id
                  account_info:
                    $ref: "#/components/schemas/ShortAccountInfoType"
                    description: The current account state
                  error:
                    type: object
                    properties:
                      msg:
                        type: string
                      code:
                        type: integer
                      details:
                        type: object
                        properties:
                          required_money:
                            type: number
              examples:
                example1:
                  summary: Success
                  value:
                    result: 1
                    sip_registration_id: 1
                example2:
                  summary: Insufficient money to add a new SIP registration
                  value:
                    error:
                      msg: Insufficient money
                      code: 127
                      details:
                        required_money: 0.5
      description: |-
        Creates a new SIP registration (the platform registers as a user on a 3rd party SIP server).

        There are two modes of SIP registration:

        <ol><li>Persistent registration, when the platform registers on a 3rd party SIP server as a user and the registration lasts until deleted (or there are network/technical issues with it — see the corresponding callback)</li><li>Non-persistent registration (set `is_persistent` to false) which is initiated only when the specificed user (with `user_id` or `user_name`) logs in via one of Voximplant SDKs. As soon the user logs off, the registration goes offline. This mode helps to implement SIP softphone-like apps using Voximplant’s SDKs.</li></ol>

        Please note that when you create a SIP registration, we reserve the subscription fee and taxes for the upcoming month. Read more in the <a href='/overview/how-billing-works'>Billing</a> page.

        Allowed roles: `Owner`, `Admin`, `Accountant`.

        **Example request:** Create SIP registration.
      x-voximplant-roles:
        - Owner
        - Admin
        - Accountant
