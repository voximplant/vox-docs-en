          $ref: "#/components/schemas/ACDStatisticsItemType"
          description: Time between operator answering and ending a call. Name is 'TalkTime' if 'abbreviation' is set to 'false'
        ACW:
          $ref: "#/components/schemas/ACDStatisticsItemType"
          description: Time between operator ended a call and changed status to a one different from the 'AFTER_SERVICE'. This time is tracked only if operator changed status to 'AFTER_SERVICE' after the call. Name is 'AfterCallWork' if 'abbreviation' is set to 'false'
