          schema:
            type: string
          description: Encoding file. The default value is UTF-8
        - name: delimiter
          in: query
          required: false
          schema:
            type: string
          description: Separator values. The default value is ';'
        - name: escape
          in: query
          required: false
          schema:
            type: string
          description: Escape character for parsing csv
        - name: reference_ip
          in: query
          required: false
          schema:
            type: string
          description: IP from the geolocation of the call list subscribers. It allows selecting the nearest server for serving subscribers
        - name: server_location
          in: query
          required: false
          schema:
            type: string
          description: Location of the server where the scenario needs to be executed. Has higher priority than `reference_ip`. Request [getServerLocations](https://api.voximplant.com/getServerLocations) for possible values
        - name: task_priority_strategy
          in: query
          required: false
          schema:
            type: string
          description: "Optional. Whether to prioritize first calling attempts or repeated ones. The possible values are: first_attempts, repeated_attempts. The default values is first_attempts."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file_content:
                  type: string
                  format: binary
                  description: Send as the "body" part of the HTTP request or as multiform. The sending "file_content" via URL is at its own risk because the network devices tend to drop HTTP requests with large headers
              required:
                - file_content
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: Whether the request completed successfully
                  count:
                    type: integer
                    description: Number of stored records
                  list_id:
                    type: integer
                    description: List ID
                  batch_id:
                    type: string
                    description: Batch UUID
              examples:
                example1:
                  summary: Example 1
                  value:
                    result: true
                    list_id: 1
                    batch_id: e9a9bed9-ebd9-48a0-9001-d218a58eb013
                    count: 1
      description: |-
        Adds a new CSV file for call list processing and starts the specified rule immediately. To send a file, use the request body. To set the call time constraints, use the following options in a CSV file: <ul><li>**__start_execution_time** – when the call list processing starts every day, UTC+0 24-h format: HH:mm:ss</li><li>**__end_execution_time** – when the call list processing stops every day,  UTC+0 24-h format: HH:mm:ss</li><li>**__start_at** – when the call list processing starts, UNIX timestamp. If not specified, the processing starts immediately after a method call</li><li>**__task_uuid** – call list UUID. A string up to 40 characters, can contain latin letters, digits, hyphens (-) and colons (:). Unique within the call list</li></ul>

        This method accepts CSV files with custom delimiters, such a commas (,), semicolons (;) and other. To specify a delimiter, pass it to the **delimiter** parameter.

        **IMPORTANT:** the account's balance should be equal or greater than 1 USD. If the balance is lower than 1 USD, the call list processing does not start, or it stops immediately if it is active.

        Allowed roles: `Owner`, `Admin`, `Developer`, `Call list manager`.
      x-voximplant-roles:
        - Owner
        - Admin
        - Developer
        - Call list manager
