          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          description: The user ID list separated by semicolons (;). Use the 'all' value to select all users. **Required** unless **user_name** is provided.
        - name: user_name
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: The user name list separated by semicolons (;). **Required** unless **user_id** is provided.
        - name: acd_queue_id
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          description: The ACD queue ID list separated by semicolons (;). Use the 'all' value to select all ACD queues. **Required** unless **acd_queue_name** is provided.
        - name: acd_queue_name
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: The ACD queue name. The ACD queue name list separated by semicolons (;). **Required** unless **acd_queue_id** is provided.
