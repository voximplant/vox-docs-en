          required: false
          schema:
            type: string
          description: "The account location (timezone). Examples: America/Los_Angeles, Etc/GMT-8, Etc/GMT+10"
        - name: account_first_name
          in: query
          required: false
          schema:
            type: string
          description: The first name
        - name: account_last_name
          in: query
          required: false
          schema:
            type: string
          description: The last name
        - name: min_balance_to_notify
          in: query
          required: false
          schema:
            type: number
