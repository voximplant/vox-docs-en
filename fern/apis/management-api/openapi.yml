          description: Filter statuses in the json array format. The array should contain objects with the **sq_status_type** and **sq_status_name** keys. Possible values for **sq_status_type** are 'CALL' and 'IM'. Possible values for **sq_status_name** are 'OFFLINE', 'ONLINE', 'READY', 'IN_SERVICE', 'AFTER_SERVICE', 'DND'
        - name: with_sq_skills
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to display agent skills
        - name: with_sq_queues
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to display agent queues
        - name: with_sq_statuses
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Whether to display agent current statuses
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of items to show in the output
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of items to skip in the output
        - name: handle_calls
          in: query
          required: true
          schema:
            type: boolean
          description: Whether the agent can handle calls. When set to false, the agent is excluded from the CALL-request distribution
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/GetSQAgentsResult"
                    description: The found agent(s)
                  count:
                    type: integer
                  total_count:
                    type: integer
              examples:
                example1:
                  summary: Example 1
                  value:
                    result:
                      - user_id: 2
                        "user_name:": johnDoe
                        user_display_name: John
                        max_simultaneous_conversations: 3
                        sq_statuses:
                          CALL:
                            sq_status_name: READY
                          IM:
                            sq_status_name: ONLINE
                    count: 1
                    total_count: 1
      description: |-
        Gets agents.

        **Example request:** Get all agents with their current statuses.
  /SQ_SetAgentInfo:
    post:
      operationId: SQ_SetAgentInfo
      summary: SQ_SetAgentInfo
      tags:
        - smartqueue
      parameters:
        - name: application_id
          in: query
          required: true
          schema:
            type: integer
          description: Application ID to search by
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: Application name to search by. Can be used instead of **application_id**
        - name: user_id
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
          description: List of user IDs separated by semicolons (;). Use 'all' to select all the users
        - name: user_name
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: List of user names separated by semicolons (;). Can be used instead of **user_id**
        - name: max_simultaneous_conversations
          in: query
          required: false
          schema:
            type: integer
            default: 5
          description: Maximum number of chats that the user processes simultaneously
        - name: handle_calls
          in: query
          required: true
          schema:
            type: boolean
          description: Whether the agent can handle calls. When set to false, the agent is excluded from the CALL-request distribution
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the request has been completed successfully
              examples:
                example1:
                  summary: Success
                  value:
                    result: 1
      description: |-
        Edits the agent settings.

        **Example request:** Edit settings of the agent with id = 2.
  /AddSecret:
    post:
      operationId: AddSecret
      summary: AddSecret
      tags:
        - secrets
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: integer
          description: Application ID to add the secret to. **Required** unless **application_name** is provided.
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: Application name. **Required** unless **application_id** is provided.
        - name: secret_name
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
            maxLength: 64
          description: Secret name. The name must start with a Latin letter and can contain up to 64 characters, including Latin letters, digits and underscores
        - name: secret_value
          in: query
          required: true
          schema:
            type: string
          description: Secret value. Maximum length is 8192 characters
        - name: description
          in: query
          required: false
          schema:
            type: string
          description: Optional. Secret description. When processing, the length is truncated to the first 200 characters
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/AddSecretResult"
                    description: Result with the added secret ID
              examples:
                example1:
                  summary: Secret successfully created
                  value:
                    result:
                      secret_id: 10
      description: |-
        Adds a new secret.

        **Example request:** Add a new secret to application 1
  /DelSecret:
    post:
      operationId: DelSecret
      summary: DelSecret
      tags:
        - secrets
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: integer
          description: Application ID. **Required** unless **application_name** is provided.
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: Application name. **Required** unless **application_id** is provided.
        - name: secret_id
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
          description: IDs to delete. A list separated by semicolons (;). Use the 'all' value to delete all secrets
        - name: secret_name
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: Secret names to delete. List separated by semicolons (;)
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the secret has been deleted successfully
              examples:
                example1:
                  summary: Successful deletion
                  value:
                    result: 1
      description: |-
        Deletes an existing secret.

        **Example request:** Delete secret with ID 10.
  /GetSecretValue:
    post:
      operationId: GetSecretValue
      summary: GetSecretValue
      tags:
        - secrets
      parameters:
        - name: application_id
          in: query
