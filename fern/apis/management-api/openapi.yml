          in: query
          required: false
          schema:
            type: boolean
          description: Whether Voximplant notifications are required
        - name: tariff_changing_notifications
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to receive the emails about the Voximplant plan changing
        - name: news_notifications
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to receive the emails about the Voximplant news
        - name: send_js_error
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to receive the emails about a JS scenario error
        - name: billing_address_name
          in: query
          required: false
          schema:
            type: string
          description: The company or businessman name
        - name: billing_address_country_code
          in: query
          required: false
          schema:
            type: string
          description: "The billing address country code (2 symbols, ISO 3166-1 alpha-2). The following values are available: AF (Afghanistan), AL (Albania), DZ (Algeria), AS (American Samoa), AD (Andorra), AO (Angola), AI (Anguilla), AQ (Antarctica), AG (Antigua and Barbuda), AR (Argentina), AM (Armenia), AW (Aruba), AU (Australia), AT (Austria), AZ (Azerbaijan), BH (Bahrain), BD (Bangladesh), BB (Barbados), BY (Belarus), BE (Belgium), BZ (Belize), BJ (Benin), BM (Bermuda), BT (Bhutan), BO (Bolivia), BA (Bosnia and Herzegovina), BW (Botswana), BV (Bouvet Island), BR (Brazil), IO (British Indian Ocean Territory), BN (Brunei), BG (Bulgaria), BF (Burkina Faso), BI (Burundi), KH (Cambodia), CM (Cameroon), CA (Canada), CV (Cape Verde), KY (Cayman Islands), CF (Central African Republic), TD (Chad), CL (Chile), CN (China), CX (Christmas Island), CO (Colombia), KM (Comoros), CG (Congo), CK (Cook Islands), CR (Costa Rica), HR (Croatia), CU (Cuba), CY (Cyprus), CZ (Czech Republic), DK (Denmark), DJ (Djibouti), DM (Dominica), DO (Dominican Republic), EC (Ecuador), EG (Egypt), SV (El Salvador), GQ (Equatorial Guinea), ER (Eritrea), EE (Estonia), ET (Ethiopia), FO (Faroe Islands), FJ (Fiji Islands), FI (Finland), FR (France), GF (French Guiana), PF (French Polynesia), TF (French Southern and Antarctic Lands), GA (Gabon), GE (Georgia), DE (Germany), GH (Ghana), GI (Gibraltar), GR (Greece), GL (Greenland), GD (Grenada), GP (Guadeloupe), GU (Guam), GT (Guatemala), GG (Guernsey), GN (Guinea), GY (Guyana), HT (Haiti), HM (Heard Island and McDonald Islands), HN (Honduras), HU (Hungary), IS (Iceland), IN (India), ID (Indonesia), IR (Iran), IQ (Iraq), IE (Ireland), IL (Israel), IT (Italy), JM (Jamaica), JP (Japan), JE (Jersey), JO (Jordan), KZ (Kazakhstan), KE (Kenya), KI (Kiribati), KR (Korea), KW (Kuwait), KG (Kyrgyzstan), LA (Laos), LV (Latvia), LB (Lebanon), LS (Lesotho), LR (Liberia), LY (Libya), LI (Liechtenstein), LT (Lithuania), LU (Luxembourg), MG (Madagascar), MW (Malawi), MY (Malaysia), MV (Maldives), ML (Mali), MT (Malta), MH (Marshall Islands), MQ (Martinique), MR (Mauritania), MU (Mauritius), YT (Mayotte), MX (Mexico), FM (Micronesia), MD (Moldova), MC (Monaco), MN (Mongolia), ME (Montenegro), MS (Montserrat), MA (Morocco), MZ (Mozambique), MM (Myanmar), NA (Namibia), NR (Nauru), NP (Nepal), NL (Netherlands), AN (Netherlands Antilles), NC (New Caledonia), NZ (New Zealand), NI (Nicaragua), NE (Niger), NG (Nigeria), NU (Niue), NF (Norfolk Island), KP (North Korea), MP (Northern Mariana Islands), NO (Norway), OM (Oman), PK (Pakistan), PW (Palau), PS (Palestinian Authority), PA (Panama), PG (Papua New Guinea), PY (Paraguay), PE (Peru), PH (Philippines), PN (Pitcairn Islands), PL (Poland), PT (Portugal), PR (Puerto Rico), QA (Qatar), RE (Reunion), RO (Romania), RU (Russia), RW (Rwanda), WS (Samoa), SM (San Marino), SA (Saudi Arabia), SN (Senegal), RS (Serbia), SC (Seychelles), SL (Sierra Leone), SG (Singapore), SK (Slovakia), SI (Slovenia), SB (Solomon Islands), SO (Somalia), ZA (South Africa), GS (South Georgia and the South Sandwich Islands), ES (Spain), LK (Sri Lanka), SD (Sudan), SR (Suriname), SZ (Swaziland), SE (Sweden), CH (Switzerland), SY (Syria), ST (Sao Tome and Principe), TW (Taiwan), TJ (Tajikistan), TZ (Tanzania), TH (Thailand), TG (Togo), TK (Tokelau), TO (Tonga), TT (Trinidad and Tobago), TN (Tunisia), TR (Turkey), TM (Turkmenistan), TC (Turks and Caicos Islands), TV (Tuvalu), UG (Uganda), UA (Ukraine), AE (United Arab Emirates), GB (United Kingdom), US (United States), UY (Uruguay), UZ (Uzbekistan), VU (Vanuatu), VA (Vatican City), VE (Venezuela), VN (Vietnam), VI (Virgin Islands), WF (Wallis and Futuna), EH (Western Sahara), YE (Yemen), ZM (Zambia), ZW (Zimbabwe), AX (Aland Islands)"
        - name: billing_address_address
          in: query
          required: false
          schema:
            type: string
          description: The valid address that needs to be specified to pay for any services. You cannot delete it later, only change
        - name: billing_address_zip
          in: query
          required: false
          schema:
            type: string
          description: The office ZIP
        - name: billing_address_phone
          in: query
          required: false
          schema:
            type: string
          description: The office phone number
        - name: account_custom_data
          in: query
          required: false
          schema:
            type: string
          description: The custom data
        - name: callback_url
          in: query
          required: false
          schema:
            type: string
          description: If URL is specified, Voximplant cloud makes HTTP POST requests to it when something happens. For a full list of reasons see the **type** field of the [AccountCallback] structure. The HTTP request has a JSON-encoded body that conforms to the [AccountCallbacks] structure
        - name: callback_salt
          in: query
          required: false
          schema:
            type: string
          description: If salt string is specified, each HTTP request made by the Voximplant cloud toward the **callback_url** has a **salt** field set to MD5 hash of account information and salt. That hash can be used be a developer to ensure that HTTP request is made by the Voximplant cloud
        - name: store_outbound_sms
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to store outgoing message texts. Default value is false
        - name: store_inbound_sms
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to store incoming message texts. Default value is false
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the request has been completed successfully
              examples:
                example1:
                  summary: Success
                  value:
                    result: 1
      description: |-
        Edits the account's profile.

        Allowed roles: `Owner`, `Admin`, `Developer`, `Accountant`, `Payer`.

        **Example request:** Change the account's password.
      x-voximplant-roles:
        - Owner
        - Admin
        - Developer
        - Accountant
        - Payer
  /SetChildAccountInfo:
    post:
      operationId: SetChildAccountInfo
      summary: SetChildAccountInfo
      tags:
        - accounts
      parameters:
        - name: child_account_id
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          description: The child account ID list separated by semicolons (;). Use the 'all' value to select all child accounts. **Required** unless **child_account_name** or **child_account_email** is provided.
        - name: child_account_name
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: The child account name list separated by semicolons (;). **Required** unless **child_account_id** or **child_account_email** is provided.
        - name: child_account_email
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          description: The child account email list separated by semicolons (;). **Required** unless **child_account_id** or **child_account_name** is provided.
        - name: new_child_account_email
          in: query
          required: false
          schema:
            type: string
          description: The new child account email
        - name: new_child_account_password
          in: query
          required: false
          schema:
            type: string
          description: The new child account password. Must be at least 8 characters long and contain at least one uppercase and lowercase letter, one number, and one special character
        - name: account_notifications
          in: query
          required: false
          schema:
            type: boolean
          description: Whether Voximplant notifications are required
        - name: tariff_changing_notifications
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to receive the emails about the Voximplant plan changing
        - name: news_notifications
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to receive the emails about the Voximplant news
        - name: active
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to enable the child account
        - name: language_code
          in: query
          required: false
          schema:
            type: string
          description: "The notification language code (2 symbols, ISO639-1). The following values are available: aa (Afar), ab (Abkhazian), af (Afrikaans), am (Amharic), ar (Arabic), as (Assamese), ay (Aymara), az (Azerbaijani), ba (Bashkir), be (Belarusian), bg (Bulgarian), bh (Bihari), bi (Bislama), bn (Bengali), bo (Tibetan), br (Breton), ca (Catalan), co (Corsican), cs (Czech), cy (Welch), da (Danish), de (German), dz (Bhutani), el (Greek), en (English), eo (Esperanto), es (Spanish), et (Estonian), eu (Basque), fa (Persian), fi (Finnish), fj (Fiji), fo (Faeroese), fr (French), fy (Frisian), ga (Irish), gd (Scots Gaelic), gl (Galician), gn (Guarani), gu (Gujarati), ha (Hausa), hi (Hindi), he (Hebrew), hr (Croatian), hu (Hungarian), hy (Armenian), ia (Interlingua), id (Indonesian), ie (Interlingue), ik (Inupiak), in (Indonesian), is (Icelandic), it (Italian), iu (Inuktitut), iw (Hebrew), ja (Japanese), ji (Yiddish), jw (Javanese), ka (Georgian), kk (Kazakh), kl (Greenlandic), km (Cambodian), kn (Kannada), ko (Korean), ks (Kashmiri), ku (Kurdish), ky (Kirghiz), la (Latin), ln (Lingala), lo (Laothian), lt (Lithuanian), lv (Latvian), mg (Malagasy), mi (Maori), mk (Macedonian), ml (Malayalam), mn (Mongolian), mo (Moldavian), mr (Marathi), ms (Malay), mt (Maltese), my (Burmese), na (Nauru), ne (Nepali), nl (Dutch), no (Norwegian), oc (Occitan), om (Oromo), or (Oriya), pa (Punjabi), pl (Polish), ps (Pashto), pt (Portuguese), qu (Quechua), rm (Rhaeto-Romance), rn (Kirundi), ro (Romanian), ru (Russian), rw (Kinyarwanda), sa (Sanskrit), sd (Sindhi), sg (Sangro), sh (Serbo-Croatian), si (Singhalese), sk (Slovak), sl (Slovenian), sm (Samoan), sn (Shona), so (Somali), sq (Albanian), sr (Serbian), ss (Siswati), st (Sesotho), su (Sudanese), sv (Swedish), sw (Swahili), ta (Tamil), te (Tegulu), tg (Tajik), th (Thai), ti (Tigrinya), tk (Turkmen), tl (Tagalog), tn (Setswana), to (Tonga), tr (Turkish), ts (Tsonga), tt (Tatar), tw (Twi), ug (Uigur), uk (Ukrainian), ur (Urdu), uz (Uz