          in: query
          required: false
          schema:
            type: integer
            default: 120
          description: Maximum time in minutes that a CALL-type request can remain in the queue without being assigned to an agent. Specify either this parameter or `call_max_waiting_time_in_seconds`. Specifying both parameters simultaniously leads to an error
        - name: im_max_waiting_time
          in: query
          required: false
          schema:
            type: integer
            default: 120
          description: Maximum time in minutes that an IM-type request can remain in the queue without being assigned to an agent. Specify either this parameter or `im_max_waiting_time_in_seconds`. Specifying both parameters simultaniously leads to an error
        - name: call_max_queue_size
