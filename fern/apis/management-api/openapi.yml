openapi: 3.1.0
info:
  title: Voximplant Management API
  version: "1.0"
  description: Voximplant Management API (also known as HTTP API) lets you manage accounts, users, applications, phone numbers, call lists, call history and other administrative resources. Methods are invoked over HTTPS with POST query-string parameters, except file-upload methods that use multipart/form-data. Responses are JSON.
servers:
  - url: https://api.voximplant.com/platform_api
security:
  - JwtAuth: []
tags:
  - name: accounts
    x-displayName: Accounts
  - name: applications
    x-displayName: Applications
  - name: users
