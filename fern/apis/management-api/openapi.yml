  /SetKeyValueItem:
    post:
      operationId: SetKeyValueItem
      summary: SetKeyValueItem
      tags:
        - key-value-storage
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: |-
            Key, up to 200 characters. A key can contain a namespace that is written before the ':' symbol, for example, test:1234. Thus, namespace 'test' can be used as a pattern in the [GetKeyValueItems](/reference/management-api/reference/key-value-storage/get-key-value-items) and [GetKeyValueKeys](/reference/management-api/reference/key-value-storage/get-key-value-keys) methods to find the keys with the same namespace.

            The key should match the following regular expression: `^[a-zA-Z0-9а-яА-ЯёЁ_\-:;.#+]*$`
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: Value for the specified key, up to 2000 characters
        - name: application_id
          in: query
          required: true
          schema:
            type: integer
          description: Application ID
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: Application name
        - name: ttl
          in: query
          required: false
          schema:
            type: integer
          description: Key expiry time in seconds. The value is in range of 0..7,776,000 (90 days), the default value is 30 days (2,592,000 seconds). The TTL is converted to an **expires_at** Unix timestamp field as part of the storage object. Note that one of the two parameters (ttl or expires_at) must be set
        - name: expires_at
          in: query
          required: false
          schema:
            type: integer
