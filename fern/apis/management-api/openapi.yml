                      secret_value: secret123value
                      description: description
                      created: "2026-04-16 09:07:26"
                      modified: "2026-04-16 09:07:26"
      description: |-
        Gets the value of a specific secret.

        **Example request:** Get the value of secret 10.
  /GetSecrets:
    post:
      operationId: GetSecrets
      summary: GetSecrets
      tags:
        - secrets
      parameters:
        - name: application_id
          in: query
          required: false
          schema:
            type: integer
          description: Application ID. **Required** unless **application_name** is provided.
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: Application name. **Required** unless **application_id** is provided.
        - name: secret_name_part
          in: query
          required: false
          schema:
            type: string
          description: Filter by the secret name part
        - name: count
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Maximum returning record number
        - name: offset
