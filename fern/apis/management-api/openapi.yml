        - name: location
          in: query
          required: false
          schema:
            type: string
          description: "The child account location (timezone). Examples: America/Los_Angeles, Etc/GMT-8, Etc/GMT+10"
        - name: min_balance_to_notify
          in: query
          required: false
          schema:
            type: number
          description: The min balance value to notify by email or SMS
        - name: support_robokassa
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to allow the robokassa payments
        - name: support_bank_card
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to allow the bank card payments
        - name: support_invoice
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to allow the bank invoices
        - name: can_use_restricted
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to allow use restricted directions
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the request has been completed successfully
              examples:
                example1:
                  summary: Success
                  value:
                    result: 1
      description: |-
        Edits the account's profile.

        **Example request:** Disable the child account.
  /GetCurrencyRate:
    post:
      operationId: GetCurrencyRate
      summary: GetCurrencyRate
      tags:
        - accounts
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: "The currency code list separated by semicolons (;). Examples: RUR, KZT, EUR, USD"
        - name: date
          in: query
          required: false
          schema:
            type: string
            description: Date string as returned by the Management API.
          description: "The date, format: YYYY-MM-DD"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/ExchangeRatesType"
                    description: The exchange rates
              examples:
                example1:
                  summary: The RUR/USD
                  value:
                    result:
                      RUR: 34.12
                example2:
                  summary: The RUR/USD and EUR/USD
                  value:
                    result:
                      RUR: 34.12
                      EUR: 0.984
      description: |-
        Gets the exchange rate on selected date (per USD).

        **Example request:** Get the current currency rate: RUR/USD.
  /GetResourcePrice:
    post:
      operationId: GetResourcePrice
      summary: GetResourcePrice
      tags:
        - accounts
      parameters:
        - name: resource_type
          in: query
          required: false
          schema:
            type: array
            items:
