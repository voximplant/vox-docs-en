        - name: push_provider_id
          in: query
          required: false
          schema:
            type: integer
          description: "The push provider id. The possible values are: 1 — APPLE, 2 — GOOGLE, 3 — APPLE_VOIP, 5 — HUAWEI. **Required** unless **push_provider_name** is provided."
        - name: application_id
          in: query
          required: false
          schema:
            type: integer
          description: The application id
        - name: application_name
          in: query
          required: false
          schema:
            type: string
          description: The application name that can be used instead of **application_id**
        - name: credential_bundle
          in: query
          required: false
          schema:
            type: string
          description: The bundle of Android/iOS/Huawei application
        - name: cert_file_name
          in: query
          required: false
          schema:
            type: string
          description: The parameter is required, when set 'cert_content' as POST body. Credentials for APPLE push
        - name: cert_password
          in: query
          required: false
          schema:
            type: string
          description: The secret password for private key. Credentials for APPLE push
        - name: is_dev_mode
          in: query
          required: false
          schema:
            type: boolean
          description: Whether to use this certificate in apple's sandbox environment. Credentials for APPLE push
        - name: sender_id
          in: query
          required: false
          schema:
            type: string
          description: The sender id, provided by Google. Credentials for GOOGLE push
        - name: server_key
          in: query
          required: false
          schema:
            type: string
          description: The server key, provided by Google. Credentials for GOOGLE push
        - name: huawei_client_id
          in: query
          required: false
          schema:
            type: string
          description: The client id, provided by Huawei. Credentials for HUAWEI push
        - name: huawei_client_secret
          in: query
          required: false
          schema:
            type: string
          description: The client secret, provided by Huawei. Credentials for HUAWEI push
        - name: huawei_application_id
          in: query
          required: false
          schema:
            type: string
          description: The application id, provided by Huawei. Credentials for HUAWEI push
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cert_content:
                  type: string
                  format: binary
                  description: Public and private keys in PKCS12 format. Credentials for APPLE push
                service_account_file:
                  type: string
                  format: binary
                  description: The service account key file, provided by Google. Can be used instead of **server_key**. Credentials for GOOGLE push
      responses:
