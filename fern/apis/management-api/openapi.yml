          required: false
          schema:
            type: integer
          description: Maximum call waiting time in seconds. Specify either this parameter or `call_max_waiting_time`. Specifying both parameters simultaniously leads to an error
        - name: im_max_waiting_time_in_seconds
          in: query
          required: false
