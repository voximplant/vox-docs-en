            $ref: "#/components/schemas/ACDQueueStatisticsServiceLevelType"
          description: List of service levels. Name is 'ServiceLevel' if 'abbreviation' is set to 'false'
        TWT:
          type: integer
          description: Sum of 'WaitingTime', in seconds. Name is 'TotalWaitingTime' if 'abbreviation' is set to 'false'
        TST:
          type: integer
          description: Sum of 'SpeedOfAnswer', in seconds. Name is 'TotalSubmissionTime' if 'abbreviation' is set to 'false'
        TAT:
          type: integer
          description: Sum for all times between user called Voximplant cloud and time they disconnect not reaching the operator, in seconds. Name is 'TotalAbandonmentTime' if 'abbreviation' is set to 'false'
        THT:
          type: integer
          description: Sum of 'HandlingTime', in seconds. Name is 'TotalHandlingTime' if 'abbreviation' is set to 'false'
        TTT:
          type: integer
          description: Sum of 'TalkTime', in seconds. Name is 'TotalTalkTime' if 'abbreviation' is set to 'false'
        TACW:
          type: integer
          description: Sum of 'AfterCallWork', in seconds. Name is 'TotalAfterCallWork' if 'abbreviation' is set to 'false'
