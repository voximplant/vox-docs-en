            type: string
          description: The script custom data, that can be accessed in the scenario via the <a href='/reference/voxengine/voxengine#customdata'>VoxEngine.customData()</a> method. Use the application/x-www-form-urlencoded content type with UTF-8 encoding
        - name: reference_ip
          in: query
          required: false
          schema:
            type: string
          description: Specifies the IP from the geolocation of predicted subscribers. It allows selecting the nearest server for serving subscribers
        - name: server_location
          in: query
          required: false
          schema:
            type: string
          description: Specifies the location of the server where the scenario needs to be executed. Has higher priority than `reference_ip`. Request [getServerLocations](https://api.voximplant.com/getServerLocations) for possible values
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: integer
                    description: Returns 1 if the request has been completed successfully
                  media_session_access_url:
                    type: string
                    description: The URL to control a created media session. You can use it for arbitrary tasks such as stopping scenario or passing additional data to it. Making HTTP request on this URL results in the [AppEvents.HttpRequest](/reference/voxengine/app-events#httprequest) VoxEngine event being triggered for scenario, with HTTP request data passed to it
                  media_session_access_secure_url:
                    type: string
                    description: The URL to control a created media session. You can use it for arbitrary tasks such as stopping scenario or passing additional data to it. Making HTTPS request on this URL results in the [AppEvents.HttpRequest](/reference/voxengine/app-events#httprequest) VoxEngine event being triggered for scenario, with HTTP request data passed to it
                  call_session_history_id:
                    type: integer
                    description: The call session history ID. To search a call session result, paste the ID to the <a href='/reference/management-api/reference/history/get-call-history'>GetCallHistory</a> method's **call_session_history_id** parameter
              examples:
                example1:
                  summary: Success
                  value:
                    result: 1
                    media_session_access_url: http://1.2.3.4:12092/request/eb769701de54cfa5.1539237068.6369268_1.2.3.4/1df792ad965d7105
                    media_session_access_secure_url: https://1.2.3.4:12092/request/eb769701de54cfa5.1539237068.6369268_1.2.3.4/1df792ad965d7105
                    call_session_history_id: 123456
      description: |-
        Runs JavaScript scenarios on a Voximplant server. The scenarios run in a new media session. To start a scenario, pass the routing rule ID associated with the necessary scenario. You can use both GET and POST requests at your choice. If you need to send custom data, we recommend to use the POST method and to include the data in the `custom_data` field of the request body. The maximum number of concurrent HTTP-requests is limited to 200. If this number is exceeded, this method returns the 429 code error (Too Many Requests) until the number of active requests is reduced. If you exceed this number, you get the 429 error code.

        Allowed roles: `Owner`, `Admin`, `Developer`, `CallsSMS`.

