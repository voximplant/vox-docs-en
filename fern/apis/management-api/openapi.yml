paths:
  /GetAccountInfo:
    post:
      operationId: GetAccountInfo
      summary: GetAccountInfo
      tags:
        - accounts
      parameters:
        - name: return_live_balance
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Whether to get the account's live balance
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/AccountInfoType"
                    description: Account's info as the [AccountInfoType] object instance
                  api_address:
                    type: string
                    description: The preferred address for the Management API requests
                  debugger_address:
                    type: string
              examples:
                example1:
                  summary: Account's info
                  value:
                    result:
                      max_sip_registrations: 0
                      support_invoice: true
                      fixed_balance: 20169.93192
                      account_notifications: true
                      news_notifications: true
                      money_on_hold: 397.584708
                      bank_card_provider: ALFABANK
                      account_email: ivan123@mail.ru
                      language_code: en
                      balance: 19772.347212
                      enabled_3ds: true
                      tariff_changing_notifications: true
                      record_storage_id: 125
                      mobile_phone: ""
                      allow_invoice: true
                      account_name: ivan123
                      is_bank_card_auto_charge_prohibited: true
                      credit_limit: 0
                      currency: RUR
                      taxpayer_type: default
                      custom_pricing: false
                      min_balance_to_notify: 300
                      created: "2020-08-07 12:00:53"
                      grace_credit: 0
                      active: true
                      frozen: false
                      a2p_sms_enabled: false
                      record_storage_name: my-storage
                      credit_limit_aware_balance_notifications: false
                      account_id: 3456750
                      billing_limits:
                        bank_card:
                          max_day_payment: 7642.17
                          min_amount: 500
                          currency: RUR
                        invoice:
                          min_amount: 1000
                          currency: RUR
                      support_robokassa: false
                      live_balance: 19772.347212
                      location: Europe/Moscow
                      support_bank_card: true
                      send_js_error: false
                    debugger_address: api-node1.voximplant.com
                    api_address: api-node1.voximplant.com
      description: |-
        Gets the account's info such as account_id, account_name, account_email etc.

        **Example request:** Get the account's info.
  /SetAccountInfo:
    post:
      operationId: SetAccountInfo
      summary: SetAccountInfo
      tags:
        - accounts
      parameters:
