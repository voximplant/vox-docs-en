                  value:
                    result: 1
                    message_id: 1
                    fragments_count: 1
      description: |-
        Sends an SMS message between two phone numbers. The source phone number should be purchased from Voximplant and support SMS (which is indicated by the **is_sms_supported** property in the objects returned by the [GetPhoneNumbers] Management API) and SMS should be enabled for it via the [ControlSms] Management API. SMS messages can be received via HTTP callbacks, see <a href='/platform/management-api/callbacks'>this article</a> for details.

