        RC:
          type: array
          items:
            $ref: "#/components/schemas/ACDStatisticsCalls"
          description: Number of calls rejected by the ACD. Call is rejected if all operators are offline or banned, or queue length is exceeded, or predicted answer time exceeds maximum specified for the query. Name is 'RejectedCalls' if 'abbreviation' is set to 'false'
        SL:
          type: array
