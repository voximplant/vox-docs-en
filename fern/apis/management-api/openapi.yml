                    description: The URL to control a created media session. It can be used for arbitrary tasks such as stopping scenario or passing additional data to it. Making HTTPS request on this URL results in the [AppEvents.HttpRequest](/reference/voxengine/app-events#httprequest) VoxEngine event being triggered for a scenario, with an HTTP request data passed to it
                  call_session_history_id:
