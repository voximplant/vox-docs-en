instances:
  - url: voximplant-new.docs.buildwithfern.com

title: Voximplant Documentation

layout:
  tabs-placement: header
  searchbar-placement: header
  page-width: full

tabs:
  overview:
    display-name: Overview
    icon: fa-duotone fa-house
    slug: overview
  voice-ai:
    display-name: Voice AI Orchestration
    icon: fa-duotone fa-microchip
    slug: voice-ai
  platform:
    display-name: Communications Platform
    icon: fa-duotone fa-network-wired
    slug: platform
  sdk:
    display-name: Web/Mobile SDKs
    icon: fa-duotone fa-code
    slug: sdk
  api-reference:
    display-name: API Reference
    icon: fa-duotone fa-server
    slug: api-reference
  help:
    display-name: Help
    icon: fa-duotone fa-circle-question
    slug: help

navigation:
  - tab: overview
    layout:
      - section: Welcome
        icon: fa-duotone fa-hand-wave
        contents:
          - page: Introduction
            path: ./pages/overview/intro.md
            icon: fa-duotone fa-book-open
          - page: Quickstart Guide
            path: ./pages/overview/quickstart.md
            icon: fa-duotone fa-rocket

  - tab: voice-ai
    layout:
      - section: Voice AI Core
        icon: fa-duotone fa-brain
        contents:
          - page: Understanding Orchestration
            path: ./pages/voice-ai/concepts.md
            icon: fa-duotone fa-lightbulb

  - tab: platform
    layout:
      - section: Core Architecture
        icon: fa-duotone fa-layer-group
        contents:
          - page: Infrastructure
            path: ./pages/platform/infra.md
            icon: fa-duotone fa-shield-halved

  - tab: sdk
    layout:
      - section: Client Libraries
        icon: fa-duotone fa-cubes
        contents:
          - page: Web SDK Setup
            path: ./pages/sdk/web.md
            icon: fa-brands fa-js

  - tab: api-reference
    layout:
      - section: REST API
        icon: fa-duotone fa-gears
        contents:
          - page: API Overview
            path: ./pages/api/overview.md
            icon: fa-duotone fa-terminal

  - tab: help
    layout:
      - section: Support
        icon: fa-duotone fa-life-ring
        contents:
          - page: Contact Us
            path: ./pages/help/contact.md
            icon: fa-duotone fa-envelope

colors:
  accent-primary:
    light: "#4824a2"
    dark: "#7c59ec"
  background:
    light: "#ffffff"
    dark: "#0a0714"
  sidebar-background:
    light: "#f9fafb"
    dark: "#100d1e"
  header-background:
    light: "#ffffff"
    dark: "#0a0714"
